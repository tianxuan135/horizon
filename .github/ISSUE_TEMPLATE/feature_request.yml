name: 功能建议
description: 提议新功能或改进现有分析模块
title: "[功能] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 请先确认边界
        本项目是**自托管的金融研究工具**，定位是呈现「事实与统计」，不是交易系统。以下类型的建议不会被接受：

        - 个股买卖建议、目标价、评级、"买入信号"
        - 自动下单、跟单、带单、交易 API 对接
        - 以收益承诺为目的的营销话术或排行榜
        - 需要绕过付费墙、登录态或 robots 才能获取的数据源

        可接受的方向：指标计算与口径改进、可视化与交互、回测与统计、数据源降级与可观测性、部署与文档。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你现在遇到的困难，而不是直接给出方案。好的需求描述从「场景」开始。
      placeholder: 例如：我想比较不同板块过去一年的拥挤度变化，但现在只能一次看一个板块，无法横截面对比。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？涉及哪条 API 或哪个页面？
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 市场拥挤度
        - 风格轮动分析
        - 估值分析
        - 因子策略分析
        - 期权策略分析
        - 设置与账号
        - 数据源与合规标注
        - 部署与容器
        - 文档与示例
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 为什么现有功能无法满足？是否有可接受的折中方案？
    validations:
      required: false

  - type: textarea
    id: datasource
    attributes:
      label: 是否需要新的数据源
      description: |
        若需要，请说明来源、许可/服务条款、是否允许程序化访问与再分发。
        无合法免费接口的品类（暗池、13F 明细、社媒情感、搜索热度）只能以**代理指标**形式加入，并需显式标注。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、论文、公式来源、竞品截图（请勿包含他人隐私数据）等。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 我已搜索过已有 Issue 与 Discussions，确认没有重复建议
          required: true
        - label: 该建议不包含荐股、带单或自动交易诉求
          required: true
        - label: 我理解该建议若涉及数据源，需通过 docs/DATA_SOURCES.md 的合规评审
          required: true