# Horizon CI：后端编译/导入检查 + 前端生产构建 + 仓库卫生（密钥与产物守卫）
# 说明：全部 job 只读仓库，不接触任何真实密钥；数据源在 CI 中自动降级为 synthetic。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Python 编译与导入检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 字节码编译（语法检查）
        run: python -m compileall -q app

      - name: 导入检查（路由与配置可加载）
        env:
          # CI 中没有外网数据源与 Redis，显式关闭可插拔数据源，避免等待超时
          YAHOO_ENABLED: "false"
          AKSHARE_ENABLED: "false"
          AUTH_ENABLED: "false"
          DATABASE_URL: "sqlite:///./ci.db"
        run: |
          python -c "
          from fastapi import FastAPI
          from app.main import app
          assert isinstance(app, FastAPI)
          paths = sorted({r.path for r in app.routes if getattr(r, 'path', '').startswith('/api/v1')})
          print(f'已注册 API 路由: {len(paths)} 条')
          assert len(paths) >= 20, f'路由数量异常: {len(paths)}'
          "

  web:
    name: Web · Next.js 生产构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 类型检查与构建
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  hygiene:
    name: 仓库卫生 · 密钥与产物守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 禁止提交运行时产物
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)(\.env|\.env\..*|.*\.db|.*\.sqlite3?|\.horizon_secret|node_modules|\.next)/?' | grep -v '\.env\.example' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下文件不应提交："; echo "$bad"; exit 1
          fi
          echo "OK：未发现 .env / 数据库 / 密钥文件"

      - name: 禁止硬编码密钥
        run: |
          set -e
          if grep -rInE '(sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --include='*.py' --include='*.ts' --include='*.tsx' --include='*.yml' --include='*.yaml' \
               --include='*.json' --include='*.md' . ; then
            echo "::error::疑似硬编码密钥，请改为环境变量"; exit 1
          fi
          if grep -rInE 'JWT_SECRET[[:space:]]*=[[:space:]]*["'\'']?[A-Za-z0-9_-]{16,}' \
               --include='*.py' --include='*.ts' --include='*.tsx' --include='*.yml' --include='*.yaml' . ; then
            echo "::error::禁止在代码中写死 JWT_SECRET"; exit 1
          fi
          echo "OK：未发现硬编码密钥"

      - name: 强制免责声明在位
        run: |
          set -e
          grep -q "不构成任何投资建议" README.md || { echo "::error::README 缺少免责声明"; exit 1; }
          grep -q "不构成任何投资建议" web/app/page.tsx || { echo "::error::首页缺少免责声明"; exit 1; }
          echo "OK：免责声明仍在"