# =============================================================================
# Horizon 极目楚天 · Docker Compose 编排
# -----------------------------------------------------------------------------
# 全部配置由 .env 驱动，文件中不含任何真实密钥。
# 启动（仓库根目录执行，让 compose 读到根目录的 .env）：
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# 含 Celery worker 的完整拓扑：
#   docker compose --env-file .env -f infra/docker-compose.yml --profile full up -d --build
#
# 端口策略：仅 nginx 对外；web / api 只绑定 127.0.0.1 便于本机调试；
#           postgres / redis 不发布任何端口。
# =============================================================================
name: horizon

# --- 共享环境变量（api 与 worker 完全一致，用 YAML 锚点避免漂移） ---------------
x-api-env: &api_env
  ENV: ${ENV:-production}
  API_HOST: 0.0.0.0
  API_PORT: "8000"
  # 通过 nginx 同源访问时无需跨域；保留本地开发来源便于直连调试
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  # 口令若含 @ : / ? # 等字符，需先做 URL 编码，否则连接串会被截断
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-horizon}:${POSTGRES_PASSWORD:-change_me_before_deploy}@postgres:5432/${POSTGRES_DB:-horizon}
  REDIS_URL: redis://redis:6379/0
  YAHOO_ENABLED: ${YAHOO_ENABLED:-true}
  AKSHARE_ENABLED: ${AKSHARE_ENABLED:-true}
  TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
  FINNHUB_KEY: ${FINNHUB_KEY:-}
  AUTH_ENABLED: ${AUTH_ENABLED:-true}
  TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-72}
  # 留空 = 每次启动随机生成（重启后所有 Token 失效）。生产必须显式设置。
  JWT_SECRET: ${JWT_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@horizon.local}
  TZ: UTC

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB（时序数据：拥挤度历史 / 净值曲线）
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: horizon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-horizon}
      POSTGRES_USER: ${POSTGRES_USER:-horizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_before_deploy}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不发布端口：仅容器网络内可达
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horizon} -d ${POSTGRES_DB:-horizon} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - horizonnet

  # ---------------------------------------------------------------------------
  # Redis：可选共享缓存（多副本时启用；单机留空 REDIS_URL 也能跑）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: horizon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - horizonnet

  # ---------------------------------------------------------------------------
  # FastAPI 后端
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: horizon-api:local
    container_name: horizon-api
    restart: unless-stopped
    environment:
      <<: *api_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 只绑本机环回，供本地调试与抓取 /docs；公网不可达
      - "127.0.0.1:${API_PUBLISHED_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).getcode() == 200 else 1)
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - horizonnet

  # ---------------------------------------------------------------------------
  # Next.js 前端（SSR + BFF rewrite）
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: horizon-web:local
    container_name: horizon-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 服务端 fetch 与 rewrites 的目标（容器网络内解析）
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PUBLISHED_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - horizonnet

  # ---------------------------------------------------------------------------
  # Celery worker（可选：数据预热 / 过期验证码清理）
  # 可选：pip 装 celery + redis 后即可启用；本模块只做数据预热与过期验证码清理，
  # 不含任何交易/下单逻辑。
  # 默认镜像里没有 celery / redis（requirements.txt 中这两个包是可选依赖），因此默认
  # 不启动（profiles: ["full"]）；依赖缺失时 app/tasks.py 会打印中文安装指引并退出，
  # 故 restart: "no"，避免反复重启刷日志。
  # 启用：docker compose -f infra/docker-compose.yml --profile full up -d worker
  # ---------------------------------------------------------------------------
  worker:
    profiles: ["full"]
    build:
      context: ../api
      dockerfile: Dockerfile
    image: horizon-api:local
    container_name: horizon-worker
    restart: "no"
    # -B：内嵌 beat，按 app/tasks.py 的 beat_schedule 触发定时任务
    command: ["celery", "-A", "app.tasks", "worker", "-B", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *api_env
      # broker / result backend 均取自 REDIS_URL（见 api/app/tasks.py 的
      # REDIS = settings.redis_url or ...）。这里指向 db1 逻辑库，与 api 侧缓存库
      # （db0，见上方 x-api-env）隔离，避免 task 结果键污染缓存键空间。
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - horizonnet

  # ---------------------------------------------------------------------------
  # nginx：唯一对外入口
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: horizon-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - horizonnet

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  nginx_cache:
    driver: local

networks:
  horizonnet:
    driver: bridge