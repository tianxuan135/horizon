# =============================================================================
# Horizon 极目楚天 · 反向代理主配置
# 挂载点：/etc/nginx/nginx.conf（完整主配置，不是 conf.d 片段）
#
# 路由：
#   /                 → web:3000      Next.js（SSR / 静态资源）
#   /_next/static/    → web:3000      带缓存区的长缓存（immutable）
#   /api/             → api:8000      保留完整路径（FastAPI 路由自带 /api/v1 前缀）
#   /api/health       → api:8000/health
#   /healthz          → nginx 自身存活（不依赖上游）
#
# 注意：add_header 在 nginx 中**不继承**——一旦某个 location 用了 add_header，
#       父级的所有 add_header 都会失效。因此每个使用 add_header 的 location
#       都重复声明了安全响应头，改一处时请同步修改其余几处。
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # 不泄露版本号
    server_tokens off;

    log_format  horizon  '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" '
                         'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  horizon;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    client_max_body_size 4m;
    server_names_hash_bucket_size 64;

    # WebSocket / HMR 升级（生产 SSR 一般用不到，保留以免将来需要）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ---------------------------------------------------------------- gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        application/vnd.ms-fontobject
        image/svg+xml
        font/ttf
        font/otf;

    # ------------------------------------------------- 静态资源缓存区 ----------
    proxy_cache_path /var/cache/nginx/static
        levels=1:2
        keys_zone=static_cache:16m
        max_size=512m
        inactive=7d
        use_temp_path=off;

    # ------------------------------------------------------- 上游 ------------
    upstream horizon_web {
        server web:3000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    upstream horizon_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen      80 default_server;
        server_name _;

        # ---- 安全响应头（server 级；被下方 override 的 location 各自重复声明）----
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header X-Frame-Options          "SAMEORIGIN"                       always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

        # ---- 通用代理头 ----
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # ---------------------------------------------------- nginx 存活探针 ----
        location = /healthz {
            access_log off;
            add_header Content-Type          "text/plain; charset=utf-8" always;
            add_header X-Content-Type-Options "nosniff"                  always;
            return 200 "ok\n";
        }

        # ------------------------------------------------------ 后端 API -------
        # proxy_pass 不带 URI 部分 → 原样透传 /api/v1/...（FastAPI 自己的前缀）
        location /api/ {
            proxy_pass          http://horizon_api;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    120s;   # 回测 / 因子挖掘可能较慢
            proxy_buffering       off;    # 流式/长响应更稳
            proxy_cache           off;    # API 响应绝不缓存（含用户数据）

            add_header X-Content-Type-Options  "nosniff"                        always;
            add_header X-Frame-Options         "SAMEORIGIN"                      always;
            add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header Cache-Control           "no-store"                        always;
        }

        # /api/health → FastAPI 根路径 /health（精确匹配优先于 /api/ 前缀）
        location = /api/health {
            access_log off;
            proxy_pass http://horizon_api/health;

            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control          "no-store" always;
        }

        # ------------------------------------------- Next.js 构建产物（长缓存）--
        location /_next/static/ {
            access_log off;
            proxy_pass        http://horizon_web;
            proxy_cache       static_cache;
            proxy_cache_key   "$scheme$host$request_uri";
            proxy_cache_valid 200 206 30d;
            proxy_cache_lock  on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;

            add_header Cache-Control          "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff"                            always;
            add_header X-Frame-Options        "SAMEORIGIN"                         always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin"    always;
        }

        # --------------------------------------------- 图片 / 字体（中等缓存）---
        location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
            proxy_pass        http://horizon_web;
            proxy_cache       static_cache;
            proxy_cache_key   "$scheme$host$request_uri";
            proxy_cache_valid 200 7d;
            proxy_cache_lock  on;
            proxy_ignore_headers Set-Cookie Cache-Control Expires;

            add_header Cache-Control          "public, max-age=604800"          always;
            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-Frame-Options        "SAMEORIGIN"                      always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        }

        # ------------------------------------------------- 前端页面（SSR）------
        location / {
            proxy_pass         http://horizon_web;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            add_header X-Content-Type-Options  "nosniff"                        always;
            add_header X-Frame-Options         "SAMEORIGIN"                      always;
            add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        }

        # --------------------------------- API 文档默认不对外暴露 ---------------
        # FastAPI 的 /docs 与 /openapi.json 挂在根路径，不经过 /api/ 前缀。
        # 自建且仅内网访问时可解除注释；公网实例建议保持关闭，或加 IP 白名单。
        # location = /docs          { proxy_pass http://horizon_api/docs; }
        # location = /openapi.json  { proxy_pass http://horizon_api/openapi.json; }

        # ------------------------------------------ 隐藏文件 / 备份文件 ----------
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
        }
    }
}